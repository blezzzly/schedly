<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline — Schedly</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #fff7fb;
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 360px;
        width: 100%;
        text-align: center;
        background: #ffffff;
        border: 1px solid rgba(236, 72, 153, 0.15);
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 12px 40px rgba(236, 72, 153, 0.1);
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        object-fit: cover;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0f172a;
      }
      p {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.6;
        color: #64748b;
      }
      .actions {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 46px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      a.primary {
        background: linear-gradient(135deg, #ec4899, #f472b6);
        color: #ffffff;
      }
      a.ghost {
        border: 1px solid rgba(148, 163, 184, 0.4);
        color: #475569;
      }
      a:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/images/logo.jpg" alt="Schedly logo" width="72" height="72" />
      <h1>You&rsquo;re offline</h1>
      <p>
        No internet connection right now. Schedly will automatically reload the
        moment you&rsquo;re back online.
      </p>
      <div class="actions">
        <a class="primary" id="retry-link" href="/">Try again</a>
        <a class="ghost" id="home-link" href="/">Back to Schedly</a>
      </div>
    </div>
    <script>
      // Real auto-reload: the moment connectivity returns, jump straight back
      // into the app instead of waiting for the user to notice.
      function onBackOnline() {
        window.location.href = "/";
      }
      window.addEventListener("online", onBackOnline);
      window.addEventListener("appinstalled", onBackOnline);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible" && navigator.onLine) onBackOnline();
      });

      // Both buttons lead to the best cached app page. While offline the SW
      // serves whatever is cached; "/" (a redirect for signed-in users) is
      // usually NOT cached, so point the buttons at a page that is.
      (function () {
        if (!("caches" in window)) return;
        var paths = ["/dashboard", "/schedule", "/login", "/"];
        caches.keys()
          .then(function (keys) {
            var name = keys.find(function (k) {
              return k.indexOf("schedly-cache-v") === 0 && k.indexOf("-rsc") === -1;
            });
            return name ? caches.open(name) : null;
          })
          .then(function (cache) {
            if (!cache) return;
            var best = "/";
            var chain = Promise.resolve();
            paths.forEach(function (p) {
              chain = chain.then(function () {
                return cache.match(p).then(function (hit) {
                  if (hit && best === "/") best = p;
                });
              });
            });
            chain.then(function () {
              var retry = document.getElementById("retry-link");
              var home = document.getElementById("home-link");
              if (retry) retry.href = best;
              if (home) home.href = best;
            });
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
