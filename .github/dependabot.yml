version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
    # `reviewers: sairwhat` was here. That account has no access to this repo, and
    # Dependabot fails the whole config file on an unknown reviewer, which silently
    # disables all update PRs.
